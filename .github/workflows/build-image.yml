# ============================================================================
# 放到你 fork 的仓库里: .github/workflows/build-image.yml
#
# 从【你自己 fork 的源码】构建镜像并推到 GHCR。
# 源码是唯一真相,镜像只是构建产物 —— 你随时可以改 client/ 或 server/ 下的代码,
# 推上来就会构建出带你改动的镜像。构建跑在 GitHub 的机器上,
# 首尔那台 2G 内存的机器一点力都不用出(Vite 打包 React 19 很吃内存,
# 2G 上大概率 OOM)。
#
# 首次使用:
#   1. Settings → Actions → General → Workflow permissions 选 "Read and write"
#   2. 手动跑一次 (Actions → Build TREK image → Run workflow)
#   3. 跑完在仓库右侧 Packages 里找到 trek,Package settings → 改成 Public
#      (镜像里只有 AGPL 源码,不含任何密钥;设成 Public 后首尔拉取免登录)
# ============================================================================
name: Build TREK image

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main]        # 用 GitHub 的 "Sync fork" 同步上游后会自动触发
    paths-ignore:
      - '**.md'
      - 'wiki/**'
      - 'docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本号和小写 owner
        id: meta
        run: |
          # GHCR 只接受全小写的路径,而 GitHub 用户名可以有大写
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          BASE="$(jq -r .version package.json)"
          SHA="$(git rev-parse --short HEAD)"

          # 镜像 tag 带 commit —— 溯源靠它,能精确定位到是哪次构建
          echo "tag=${BASE}-${SHA}" >> "$GITHUB_OUTPUT"

          # APP_VERSION 必须是【纯数字点分】版本,不能带 commit 后缀。
          # TREK 的 compareVersions 是自己实现的,不是 semver:
          #   v.split('-pre.')             只认 "-pre." 这一种后缀
          #   base.split('.').map(Number)  "3.4.1-3c8988d" → [3, 4, NaN]
          #   pb.parts[i] || 0             NaN 是 falsy → 被当成 0
          # 结果:带后缀时 TREK 认为自己在 3.4.0,上游 3.4.1 永远"有可用更新",
          # 提示一直挂着消不掉。用 + 号也不行 —— 它不是 semver,一样切不出来。
          echo "app_version=${BASE}" >> "$GITHUB_OUTPUT"

          echo "镜像 tag: ${BASE}-${SHA}   APP_VERSION: ${BASE}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # 首尔是 x86,只构建 amd64,省一半时间
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/trek:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/trek:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出部署命令
        run: |
          echo "### 镜像构建完成" >> $GITHUB_STEP_SUMMARY
          echo '在【首尔服务器】上执行升级:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'bash /opt/trek/bin/upgrade.sh ${{ steps.meta.outputs.tag }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
